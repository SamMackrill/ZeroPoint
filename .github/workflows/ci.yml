name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # --with-deps needs the Ubuntu apt mirror. When that is unreachable, apt hangs until the job
      # times out, so cap it and fall back to the browser alone: ubuntu-latest already carries
      # Chromium's system libraries. If they were ever missing, test:e2e fails loudly.
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          timeout 240 npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright install --with-deps failed (apt mirror unreachable?); installing the browser alone"
          npx playwright install chromium
      # Missing visual baselines are recorded by tests/visual/labs.spec.ts and uploaded below; changed ones fail.
      - run: npm run test:e2e
      - run: npm run build
      - run: node scripts/bundle-size.mjs >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/visual/__screenshots__/
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
